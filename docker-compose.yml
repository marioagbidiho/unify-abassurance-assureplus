# Plateforme UNIFY complète en local (DEV / REC) : sources, Kafka, Hadoop, Spark, MLflow, API, appli.
# Démarrage : docker compose up -d   (prévoir 12 Go de RAM)
# En PRD : Cloudera CDP Private Cloud Base (cf. Bloc 1, hébergement hybride).

services:
  # ------------------------------------------------------------ sources (BDD X / BDD Y)
  oracle:
    image: gvenzl/oracle-free:23-slim
    environment: { ORACLE_PASSWORD: "${ORACLE_PASSWORD:-change_me}" }
    ports: ["1521:1521"]
    volumes: ["./sql/01_source_ab_oracle.sql:/container-entrypoint-initdb.d/01.sql:ro"]

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment: { ACCEPT_EULA: "Y", MSSQL_SA_PASSWORD: "${MSSQL_PASSWORD:-Change_me_2026}", MSSQL_AGENT_ENABLED: "true" }
    ports: ["1433:1433"]

  # ------------------------------------------------------------ P2 transport
  kafka:
    image: apache/kafka:3.9.0           # mode KRaft (sans ZooKeeper)
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 168     # rétention 7 jours (Bloc 1, D1)

  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.1
    depends_on: [kafka]
    ports: ["8081:8081"]
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:9092

  connect:                               # P1 CDC : Debezium sur Kafka Connect
    image: quay.io/debezium/connect:2.7
    depends_on: [kafka, oracle, sqlserver]
    ports: ["8083:8083"]
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: unify-connect
      CONFIG_STORAGE_TOPIC: _connect_configs
      OFFSET_STORAGE_TOPIC: _connect_offsets
      STATUS_STORAGE_TOPIC: _connect_status

  # ------------------------------------------------------------ Data lake Hadoop
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    environment: { CLUSTER_NAME: unify }
    ports: ["9870:9870", "8020:8020"]
    volumes: ["hdfs-name:/hadoop/dfs/name"]

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    depends_on: [namenode]
    environment: { SERVICE_PRECONDITION: "namenode:9870", CORE_CONF_fs_defaultFS: "hdfs://namenode:8020" }
    volumes: ["hdfs-data:/hadoop/dfs/data"]

  # ------------------------------------------------------------ Spark
  spark-master:
    image: apache/spark:4.0.1-python3
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports: ["7077:7077", "8080:8080"]

  spark-worker:
    image: apache/spark:4.0.1-python3
    depends_on: [spark-master]
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077

  # ------------------------------------------------------------ MLOps
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.17.2
    command: mlflow server --host 0.0.0.0 --port 5000
    ports: ["5000:5000"]

  # ------------------------------------------------------------ P8 / P9 exposition
  api:
    build: .
    ports: ["8000:8000"]
    environment:
      UNIFY_JWT_SECRET: "${UNIFY_JWT_SECRET:-change_me}"

  app:
    image: python:3.12-slim
    working_dir: /app
    volumes: ["./:/app"]
    command: sh -c "pip install -q -r requirements.txt && streamlit run app/streamlit_app.py --server.port 8501 --server.address 0.0.0.0"
    ports: ["8501:8501"]

volumes:
  hdfs-name:
  hdfs-data:
