name: CI - qualité, tests, SonarCloud

on:
  push:
    branches: [main, develop, "feature/**", "fix/**", "hotfix/**", "release/**"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Analyse statique (ruff + bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: { python-version: "3.12", cache: pip, cache-dependency-path: "requirements/*.lock" }
      - name: Outils d'analyse (versions figées + empreintes vérifiées)
        run: 'pip install --only-binary :all: --require-hashes -r requirements/lint.lock'
      - name: Ruff - style, bugs, complexité (C90), sécurité (S)
        run: ruff check src tests app --output-format=github && ruff format --check src tests app
      - name: Bandit - vulnérabilités (sévérité >= moyenne)
        run: bandit -r src -ll -f txt

  tests:
    name: Tests unitaires + intégration Spark + couverture
    runs-on: ubuntu-latest
    needs: lint
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}   # analyse CI (avec couverture) si le secret existe
      PYTHONPATH: src                           # package visible aussi des workers Spark
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { fetch-depth: 0 }            # historique complet requis par SonarCloud
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: { python-version: "3.12", cache: pip, cache-dependency-path: "requirements/*.lock" }
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5 - Spark 4 nécessite Java 17+
        with: { distribution: temurin, java-version: "17" }
      - name: Dépendances (fichier verrouillé + empreintes SHA-256)
        # pyspark n'est publié qu'en source sur PyPI : seule exception à --only-binary
        run: 'pip install --only-binary :all: --no-binary pyspark --require-hashes -r requirements/ci.lock'
      - name: Tests + couverture (seuil bloquant 80 %)
        run: >
          pytest --cov --cov-report=xml --cov-report=term-missing --cov-report=html
          --junitxml=reports/junit.xml
      - name: Rapport de couverture
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/
            reports/junit.xml
      # Par défaut, SonarCloud analyse le dépôt en « Automatic Analysis » à chaque push.
      # Pour importer aussi la couverture : désactiver l'Automatic Analysis et créer le
      # secret SONAR_TOKEN ; cette étape prend alors le relais.
      - name: Analyse SonarCloud (Quality Gate + couverture)
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@2f77a1ec69fb1d595b06f35ab27e97605bdef703 # v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Construction de l'image de l'API
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: docker build -t unify-api:${{ github.sha }} .
