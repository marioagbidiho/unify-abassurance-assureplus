# Référentiels unifiés (tables ref_*) : chaque code source (AB = Oracle, AP = SQL Server)
# est traduit vers un code unique. Les codes sont comparés après normalisation
# (majuscules, sans accents, espaces -> "_"). Un code absent du référentiel n'est PAS
# deviné : la ligne est signalée par la règle qualité REF_INCONNU.

ref_produit:
  AUTO:        {libelle: "Assurance automobile",      ab: [AUTO, AUTOMOBILE],                  ap: [AUTO_STD, AUTO_PREMIUM, AUTO]}
  HABITATION:  {libelle: "Multirisque habitation",    ab: [HABITATION, MRH],                   ap: [HOME]}
  SANTE:       {libelle: "Complémentaire santé",      ab: [SANTE, MUTUELLE],                   ap: [HEALTH]}
  PRO:         {libelle: "Assurance professionnelle", ab: [PRO, PROFESSIONNELLE, MULTIRISQUE_PRO], ap: [BUSINESS]}
  ASSISTANCE:  {libelle: "Assistance premium",        ab: [ASSISTANCE],                        ap: [ASSIST_PREMIUM, ASSISTANCE]}

