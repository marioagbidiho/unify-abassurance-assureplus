[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unify"
version = "1.0.1"
description = "UNIFY - Plateforme Data & IA unifiée AbAssurance / AssurePlus (Bloc 3 BCD&IA)"
readme = "README.md"
authors = [{ name = "AGBIDIHO Mario" }]
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "pyarrow>=14",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "pyyaml>=6",
    "sqlalchemy>=2.0",
    "cryptography>=42",
]

[project.optional-dependencies]
spark = ["pyspark>=4.0,<4.1"]
kafka = ["confluent-kafka>=2.4"]
api = ["fastapi>=0.110", "uvicorn>=0.29", "pyjwt>=2.8", "python-multipart>=0.0.9"]
app = ["streamlit>=1.35", "altair>=5"]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.5", "bandit>=1.7"]

[project.scripts]
unify = "unify.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
unify = ["../../config/*.yaml"]

# ---------------------------------------------------------------- qualité
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP", "S", "SIM", "C90"]
ignore = ["S101"]           # assert autorisé dans les tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "N802"]
"src/unify/spark_jobs/*" = ["N812"]     # convention PySpark : functions as F, types as T

[tool.ruff.lint.mccabe]
max-complexity = 10

# ---------------------------------------------------------------- tests
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
    "spark: tests d'intégration qui démarrent une session Spark locale (plus lents)",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src/unify"]
branch = true
omit = ["src/unify/cli.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80
exclude_lines = ["pragma: no cover", "if __name__ == .__main__.:"]

[tool.coverage.xml]
output = "coverage.xml"
