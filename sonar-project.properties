# Analyse de qualité de code SonarCloud / SonarQube
# Organisation et clé : à adapter si le dépôt est importé sous un autre compte
sonar.organization=agbidiho-mario
sonar.projectKey=agbidiho-mario_unify-abassurance-assureplus
sonar.projectName=UNIFY - Plateforme Data & IA AbAssurance / AssurePlus
sonar.projectVersion=1.0.1

sonar.sources=src,app
sonar.tests=tests
sonar.sourceEncoding=UTF-8
sonar.python.version=3.12

# Rapports produits par la CI
sonar.python.coverage.reportPaths=coverage.xml
sonar.python.xunit.reportPath=reports/junit.xml

# Code généré / données exclues de l'analyse
sonar.exclusions=data/**,lake/**,docs/**,**/__init__.py
sonar.coverage.exclusions=app/**,src/unify/cli.py
